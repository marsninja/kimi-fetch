[project]
name = "kimi-fetch"
version = "0.1.0"
description = "Resumable, file-by-file downloader for the moonshotai/Kimi-K3 Hugging Face repo, built as a zero-RC native binary from borrow-checked Jac"
entry-point = "main.na.jac"
kind = "native-binary"

# Every module compiles under the zero-RC ownership contract: no refcounting
# or collector machinery may survive into the binary (verified in CI with
# `jac nacompile main.na.jac --gc none --enforce-nogc --assert-no-rc`).
[gc]
default = "none"

[gc.enforce]
modules = ["*"]

# W6002's JS-slop table matches by method name only, and `find` is the one
# Python/JS homonym in it, so every str.find here warned. Fixed upstream
# (jaseci fix/w6002-str-find-false-positive); drop this ignore once CI's
# pinned jac release contains the fix — see DOGFOOD.md issue 7.
[check.lint]
ignore = ["W6002"]
