name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runs the pinned RELEASE toolchain. Running the compiler from a pinned
# source checkout (install release binary + `[dev] jaclang_source` stanza)
# is the intended dev loop, but release binaries currently cannot drive a
# source tree: the ownership pass dies with a scheduling error, and newer
# source SHAs additionally hit a circular import in rc_facts_pass — see
# DOGFOOD.md issues 12 and 13. When those are fixed upstream, restore:
#   git init "$RUNNER_TEMP/jaseci" && git -C "$RUNNER_TEMP/jaseci" fetch \
#     --depth 1 https://github.com/jaseci-labs/jaseci.git <SHA> && \
#     git -C "$RUNNER_TEMP/jaseci" checkout FETCH_HEAD
#   printf '\n[dev]\njaclang_source = "%s/jaseci/jac"\n' "$RUNNER_TEMP" >> jac.toml
env:
  JAC_VERSION: "0.34.7"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jac ${{ env.JAC_VERSION }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jaseci-labs/jaseci/main/scripts/install.sh \
            | bash -s -- --version "$JAC_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jac" --version

      - name: Type-check and ownership-check
        run: jac check .

      - name: Tests
        run: jac test main.na.jac

      - name: Native build (zero-RC proof)
        run: jac nacompile main.na.jac --scrub --gc none --enforce-nogc --assert-no-rc -o kimi-fetch

      - name: Offline smoke
        run: |
          ./kimi-fetch --help
          mkdir -p smoke/K3/.kimi-fetch
          cp tests/fixture_manifest.json smoke/K3/.kimi-fetch/manifest.json
          ./kimi-fetch smoke/K3 --status | tee status.out
          grep -q "0 done, 2 pending (300 bytes) of 2 files" status.out
